<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a12" />
    <meta name="description" content="KoSta — лёгкий защищённый мессенджер" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M21 17v30M45 17L26 32l19 15' fill='none' stroke='white' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>KoSta</title>
    <script>
      // Тему применяем до первого рендера, чтобы не было вспышки светлого экрана.
      try {
        var stored = localStorage.getItem('kosta-theme');
        var theme = stored === 'light' ? 'light' : 'dark';
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        }
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage может быть недоступен — остаёмся на тёмной теме */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
