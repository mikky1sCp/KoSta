[package]
name = "kosta-server"
version.workspace = true
edition.workspace = true

[dependencies]
kosta-crypto = { path = "../kosta-crypto" }
kosta-transport = { path = "../kosta-transport" }
kosta-protocol = { path = "../kosta-protocol" }
kosta-tl = { path = "../kosta-tl" }

tokio = { version = "1", features = ["full"] }
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"

native-tls = "0.2"
# Только TOML: остальные форматы config (yaml/json/ron/ini) в проекте не нужны,
# а их зависимости тянут необслуживаемые крейты (yaml-rust) в audit.
config = { version = "0.13", default-features = false, features = ["toml"] }

lru = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.24"

actix-web = "4"
actix-rt = "2"
actix-web-actors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-files = "0.6"
actix = "0.13"
prometheus = { version = "0.13", features = ["process"] }