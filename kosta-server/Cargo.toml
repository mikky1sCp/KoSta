[package]
name = "kosta-server"
version.workspace = true
edition.workspace = true

[dependencies]
kosta-core = { path = "../kosta-core" }
kosta-crypto = { path = "../kosta-crypto" }
kosta-transport = { path = "../kosta-transport" }
kosta = { path = "../kosta" }

tokio = { version = "1", features = ["full"] }
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
lazy_static = "1.4"
hex = "0.4"

rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
chrono = "0.4"

native-tls = "0.2"
config = "0.13"

lru = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.24"

actix-web = "4"
actix-rt = "2"
actix-web-actors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-files = "0.6"
actix = "0.13"
actix-cors = "0.6"
prometheus = { version = "0.13", features = ["process"] }

# Добавленные зависимости
actix-multipart = "0.6"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
bytes = "1"