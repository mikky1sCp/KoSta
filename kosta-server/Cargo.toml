[package]
name = "kosta-server"
version.workspace = true
edition.workspace = true

[dependencies]
kosta-core = { path = "../kosta-core" }
kosta-crypto = { path = "../kosta-crypto" }
kosta-transport = { path = "../kosta-transport" }
kosta = { path = "../kosta" }

tokio = { version = "1", features = ["full"] }
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
lazy_static = "1.4"
hex = "0.4"

rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
chrono = "0.4"

native-tls = "0.2"       # добавлено
config = "0.13"          # добавлено