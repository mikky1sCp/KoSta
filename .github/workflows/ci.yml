name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # native-tls на Linux собирается против OpenSSL
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  windows-build-test:
    name: Build, clippy, tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  web-ui:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    name: MTProto 2.0 and web smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build server and examples
        run: cargo build --workspace --bins --examples

      - name: Build web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Start server
        run: |
          ./target/debug/kosta-server > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"
          cat server.log
          exit 1

      - name: MTProto 2.0 e2e (handshake, signUp, dialog, message, history)
        run: KOSTA_PHONE=+79990000001 ./target/debug/examples/mtproto_client

      - name: Web API and WebSocket smoke
        run: node scripts/smoke.mjs --phone=+79990000001

      - name: UI is served
        run: curl -sf http://127.0.0.1:8081/ | grep -q "KoSta"

      - name: MTProto garbage resistance
        run: node scripts/tl-garbage.mjs

      - name: MTProto server limits
        run: node scripts/limits.mjs

      - name: Server log
        if: always()
        run: tail -n 80 server.log