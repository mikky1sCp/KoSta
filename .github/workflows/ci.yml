name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # native-tls на Linux собирается против OpenSSL
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  e2e:
    name: Protocol and web smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build server and examples
        run: cargo build --workspace --bins --examples

      - name: Start server
        run: |
          ./target/debug/kosta-server > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"
          cat server.log
          exit 1

      - name: TCP protocol e2e (handshake, dialog, message, history)
        run: KOSTA_PHONE=+79990000001 ./target/debug/examples/test_client

      - name: Web API and WebSocket smoke
        run: node scripts/smoke.mjs --phone=+79990000001

      - name: TL parser garbage resistance
        run: node scripts/tl-garbage.mjs

      - name: Server limits
        run: node scripts/limits.mjs

      - name: Server log
        if: always()
        run: tail -n 80 server.log
