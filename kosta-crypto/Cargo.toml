[package]
name = "kosta-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
kosta-core = { path = "../kosta-core" }
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
subtle = "2.4"
hex = "0.4"
sha1 = "0.10"
cipher = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm = "0.10"