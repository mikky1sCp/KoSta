[server]
host = "127.0.0.1"
port = 8080
db_path = "kosta.db"
use_tls = false
cert_path = "cert.pem"
key_path = "key.pem"
# Close a connection after this many seconds without data from the client
idle_timeout_secs = 300
# Maximum number of simultaneous TCP connections
max_connections = 256

[web]
# Web API + WebSocket + static UI (собранная Vite-версия)
host = "127.0.0.1"
port = 8081
ui_dir = "web-ui/dist"

[media]
# Каталог для загруженных файлов (KOSTA_MEDIA_DIR переопределяет)
dir = "media"
# Максимальный размер одного файла, МБ
max_upload_mb = 25
